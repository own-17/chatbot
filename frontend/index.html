<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatDPT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #525252;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-black via-neutral-900 to-neutral-950 text-white h-screen overflow-hidden">

    <!-- Main Container -->
    <div class="flex flex-col h-screen">

        <!-- Header -->
        <header
            class="border-b border-neutral-800 bg-neutral-900/70 backdrop-blur-md px-6 py-4 flex items-center justify-between shadow-lg">

            <div>
                <h1 class="text-2xl font-bold tracking-wide">
                    Chat<span class="text-blue-500">DPT</span>
                </h1>

                <p class="text-sm text-neutral-400">
                    AI Assistant Powered by Groq
                </p>
            </div>

            <div
                class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-lg font-bold shadow-lg">
                AI
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chat-container"
            class="flex-1 overflow-y-auto px-4 md:px-8 py-6 space-y-5 max-w-4xl w-full mx-auto">

            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div
                    class="bg-neutral-800 border border-neutral-700 px-5 py-4 rounded-2xl rounded-bl-sm max-w-md shadow-md">
                    <p class="text-sm leading-7 text-neutral-200">
                        👋 Hello! I am your AI Assistant.<br>
                        Ask me anything about coding, projects, AI, or technology.
                    </p>
                </div>
            </div>

        </main>

        <!-- Input Area -->
        <div
            class="border-t border-neutral-800 bg-neutral-900/90 backdrop-blur-md px-3 md:px-6 py-4 shadow-2xl">

            <div
                class="max-w-4xl mx-auto bg-neutral-800 border border-neutral-700 rounded-3xl p-3 flex items-end gap-3">

                <!-- Textarea -->
                <textarea id="input" rows="1" placeholder="Type your message here..."
                    class="flex-1 bg-transparent outline-none resize-none px-3 py-2 text-white placeholder:text-neutral-500 text-sm md:text-base"></textarea>

                <!-- Ask Button -->
                <button id="ask"
                    class="bg-blue-600 hover:bg-blue-700 transition-all duration-200 px-5 py-2 rounded-2xl font-medium shadow-lg cursor-pointer active:scale-95">
                    Ask
                </button>

            </div>

            <!-- Footer -->
            <p class="text-center text-xs text-neutral-500 mt-3">
                ChatDPT can make mistakes. Verify important information.
            </p>

        </div>

    </div>

    <!-- Script -->
    <script src="./script.js"></script>

</body>

</html>
